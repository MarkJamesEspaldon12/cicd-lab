name: Hello CI
on:
  push:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello from $(uname -a)"
      - name: List repo files
        run: ls -la

  info:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Who, where, disk
        run: |
          whoami
          pwd
          df -h /
      